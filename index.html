<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>KeyHaven Asia</title>
    <!-- Автоматический редирект на английскую версию -->
    <meta http-equiv="refresh" content="0; url=./en/" />
    <script>
        // Небольшой умный скрипт: если у пользователя браузер на русском, кидаем на /ru/
        var userLang = navigator.language || navigator.userLanguage; 
        if (userLang.startsWith('ru')) {
            window.location.href = './ru/';
        } else {
            window.location.href = './en/';
        }
    </script>
</head>
<body>
    <p>Redirecting to <a href="./en/">KeyHaven Asia...</a></p>
</body>
</html>
