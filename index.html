<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyHaven Asia</title>
    <script>
        // Относительный редирект: работает и локально (file://), и на GitHub Pages, и на своём домене.
        // Определяем язык браузера: ru* -> русская версия, иначе -> английская.
        var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
        window.location.replace(lang.indexOf('ru') === 0 ? 'ru/' : 'en/');
    </script>
    <!-- Фолбэк, если JavaScript отключён: редирект на английскую версию -->
    <noscript><meta http-equiv="refresh" content="0; url=en/"></noscript>
</head>
<body>
    <p>Redirecting to <a href="en/">KeyHaven Asia...</a></p>
</body>
</html>
