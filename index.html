<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KeyHaven Asia</title>
    
    <!-- Универсальный редирект для мета-тега (без слэша в начале) -->
    <meta http-equiv="refresh" content="0; url=en/" />
    
    <script>
        // Определяем язык браузера пользователя
        var userLang = navigator.language || navigator.userLanguage; 
        
        // Делаем редирект с помощью относительных путей. 
        // Это сработает и на localhost, и на GitHub Pages!
        if (userLang.startsWith('ru')) {
            window.location.replace('ru/');
        } else {
            window.location.replace('en/');
        }
    </script>
</head>
<body>
    <p>Redirecting to <a href="en/">KeyHaven Asia...</a></p>
</body>
</html>
